name: Laravel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build


      - name: Salin .env untuk testing
        run: cp .env.example .env.testing

      - name: Set konfigurasi database SQLite di .env.testing
        run: |
          echo "APP_ENV=testing" >> .env.testing
          echo "DB_CONNECTION=sqlite" >> .env.testing
          echo "DB_DATABASE=:memory:" >> .env.testing
          echo "SESSION_DRIVER=file" >> .env.testing
          echo "CACHE_DRIVER=array" >> .env.testing

      - name: Generate app key
        run: php artisan key:generate --env=testing

      - name: Jalankan migrasi
        run: php artisan migrate --env=testing --force

      - name: Jalankan test (hanya jika ada folder tests)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            echo "Tests directory found, running tests..."
            php artisan test --env=testing
          else
            echo "No tests found; skipping test step."
          fi
